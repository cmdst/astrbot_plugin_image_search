name: astrbot_plugin_image_search
display_name: 搜图路由 Agent
desc: "纯搜图插件 v2.1.0：唯一 LLM 工具 image_search(image_refs, question, intent, search_type)。主模型把图片与可选的检索线索（intent：怀疑的角色 / 作品 / 场景）交给插件，插件按可配置源池路由：A 类视觉联网模型（AstrBot provider 引用或自定义 OpenAI 兼容端点）与 B 类图搜图引擎（SauceNAO / ascii2d / trace.moe，需开启内置只读图床）。逐源失败自动换源、单源超时隔离、多源命中合并去重；返回结构化 JSON + 可读摘要，不发送消息、不抛异常、不含 API Key。"
short_desc: "纯搜图工具 image_search：可用 intent 提供角色/作品/场景线索，源池可配 vision/engine，失败换源、多源合并，返回结构化 JSON"
version: 2.1.0
author: dev
repo: "https://github.com/cmdst/astrbot_plugin_image_search"
astrbot_version: ">=4.16,<5"
